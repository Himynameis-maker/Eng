<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>English Reading</title>
<style>
:root{--bg:#fff;--fg:#1f2328;--mut:#6b7280;--bd:#d8dee4;--hd:#f6f8fa;--g1:rgba(255,193,7,.4);--g2:rgba(66,165,245,.35);--g3:rgba(102,187,106,.38);--g4:rgba(239,83,80,.30);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#16181d;--fg:#e6e8eb;--mut:#9aa3ad;--bd:#343a42;--hd:#1e2127;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#16181d;--fg:#e6e8eb;--mut:#9aa3ad;--bd:#343a42;--hd:#1e2127;color-scheme:dark}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.7 system-ui,"Hiragino Sans","Yu Gothic",sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--hd);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:11;display:flex;gap:8px;align-items:center;padding:8px 12px;background:var(--hd);border-bottom:1px solid var(--bd)}
header small{margin-left:auto;color:var(--mut);font-size:12px}
button{font:inherit;font-size:14px;padding:6px 14px;border:1px solid var(--bd);border-radius:999px;background:var(--bg);color:var(--fg);cursor:pointer}
button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
main{max-width:720px;margin:0 auto;padding:16px 16px 40px;min-height:calc(100vh + 160px)}
h1{font:700 24px/1.3 Georgia,serif;margin:8px 0 16px}
.ln{display:flex;gap:10px;margin:4px 0}
.n{flex:none;width:1.6em;color:var(--mut);font-size:12px;text-align:right;padding-top:.5em}
.t{font:18px/2.1 Georgia,"Times New Roman",serif}
.c1{--g:var(--g1)}.c2{--g:var(--g2)}.c3{--g:var(--g3)}.c4{--g:var(--g4)}
body.mark .mk{background:var(--g);border-radius:3px;padding:1px 2px}
body.mark .mk::after{content:attr(data-l);font:600 .55em system-ui,sans-serif;color:var(--mut);vertical-align:super;margin-left:2px}
.note{display:none;margin:0 0 6px;padding:0;list-style:none;font-size:13px;color:var(--mut)}
body.mark .note{display:block}
.note li{border-left:4px solid var(--g);padding-left:8px;margin:2px 0}
#ja{opacity:0;transition:opacity .6s;margin-top:32px;padding-top:12px;border-top:1px solid var(--bd)}
#ja.on{opacity:1}
#ja p{margin:4px 0;display:flex;gap:10px}
#vocab,body.vocab #read{display:none}
body.vocab #vocab{display:block}
table{width:100%;border-collapse:collapse}
td{padding:8px 6px;border-bottom:1px solid var(--bd);vertical-align:top}
.ctx{color:var(--mut);font:14px/1.6 Georgia,serif}.ctx b{color:var(--fg)}
</style>
</head>
<body>
<header>
  <button id="bv" aria-pressed="false">英単語表</button>
  <button id="bm" aria-pressed="false">マーカー</button>
  <small id="meta"></small>
</header>
<main>
  <section id="read">
    <h1 id="title"></h1>
    <div id="body"></div>
    <div id="ja"></div>
  </section>
  <section id="vocab"></section>
</main>

<script>
const D=JSON.parse(document.getElementById('data').textContent);
const $=s=>document.querySelector(s);
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const mk=s=>esc(s).replace(/\[\[(\d)\|([^|\]]*)\|([^\]]*)\]\]/g,'<span class="mk c$1" data-l="$2">$3</span>');
const plain=s=>s.replace(/\[\[\d\|[^|\]]*\|([^\]]*)\]\]/g,'$1');

const sel=D.draw.find(d=>d.n===D.selected);
$('#meta').textContent='テーマ：'+sel.cat+'（'+sel.n+'）／ 国：'+sel.iso+' '+D.country;
$('#title').textContent=D.title;

$('#body').innerHTML=D.lines.map((l,i)=>
  '<div class="ln"><span class="n">'+(i+1)+'</span><div><span class="t">'+mk(l.en)+'</span>'+
  (l.notes?'<ul class="note">'+l.notes.map(n=>'<li class="c'+n[0]+'">'+esc(n[1])+'</li>').join('')+'</ul>':'')+
  '</div></div>').join('');

$('#ja').innerHTML=D.lines.map((l,i)=>'<p><span class="n">'+(i+1)+'</span><span>'+esc(l.ja)+'</span></p>').join('');

$('#vocab').innerHTML='<table>'+D.vocab.map(v=>{
  const c=esc(plain(D.lines[v[3]-1].en)).replace(new RegExp('\\b'+v[4]+'\\b','i'),m=>'<b>'+m+'</b>');
  return '<tr><td><b>'+esc(v[0])+'</b><br><small>'+esc(v[1])+'</small></td><td>'+esc(v[2])+'</td><td class="ctx">L'+v[3]+'　'+c+'</td></tr>';
}).join('')+'</table>';

function toggle(btn,cls,after){
  btn.onclick=()=>{
    const on=btn.getAttribute('aria-pressed')!=='true';
    btn.setAttribute('aria-pressed',on);
    document.body.classList.toggle(cls,on);
    if(after)after();
  };
}
toggle($('#bv'),'vocab',()=>scrollTo(0,0));
toggle($('#bm'),'mark');

// 少しスクロールすると和訳が現れ、以後は消えない
let shown=false;
const chk=()=>{if(!shown&&scrollY>30){shown=true;$('#ja').classList.add('on');}};
addEventListener('scroll',chk,{passive:true});
chk();
</script>
